      html { cursor: var(--cur-default); }

        [role="checkbox"], [role="option"], [role="menuitem"], [role="menuitemradio"], [role="gridcell"], .k-row-click,
        input[type="checkbox"], input[type="radio"], input[type="range"], input[type="color"], input[type="file"]) { cursor: var(--cur-pointer); }
      :root :is(input:not([type]), input[type="text"], input[type="number"], input[type="search"], input[type="email"],
        input[type="password"], input[type="url"], input[type="tel"], textarea, [contenteditable="true"]) { cursor: var(--cur-text); }
      :root:root .cursor-pointer { cursor: var(--cur-pointer); }
      :root:root .cursor-default { cursor: var(--cur-default); }
      :root:root .cursor-not-allowed { cursor: var(--cur-disabled); }

      :root:root .cursor-help { cursor: var(--cur-help); }
      :root:root .cursor-crosshair { cursor: var(--cur-crosshair); }

        .k-mm-skel, .k-ul-skel, .skeleton-shimmer, [aria-busy="true"]) { cursor: var(--cur-loading); }
      :root:root:root [data-ready="1"] .skeleton-shimmer, :root:root:root .k-mm-loading.k-mm-loading-off { cursor: inherit; }
      :root:root :is(button, input, select, textarea, [role="button"], [role="tab"], [role="switch"], [role="radio"], [role="checkbox"],
        [role="option"], [role="menuitem"]):disabled,

      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-track:vertical { margin: 3px 0; }
      ::-webkit-scrollbar-track:horizontal { margin: 0 3px; }
      ::-webkit-scrollbar-corner { background: transparent; }
      ::-webkit-scrollbar-thumb { background-color: transparent; background-clip: padding-box; border: 3px solid transparent; border-radius: 6px; }
      *:hover > ::-webkit-scrollbar-thumb, .popup-scrollbar::-webkit-scrollbar-thumb, .tool-scrollbar::-webkit-scrollbar-thumb { background-color: var(--scrollbar-thumb); }
      ::-webkit-scrollbar-thumb:hover, .popup-scrollbar::-webkit-scrollbar-thumb:hover, .tool-scrollbar::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-hover); }
      .popup-scrollbar, .tool-scrollbar { scrollbar-gutter: stable; }
      @supports not selector(::-webkit-scrollbar) {
        .popup-scrollbar, .tool-scrollbar { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes scaleUp {
        from { opacity: 0; transform: translateY(6px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }

      @keyframes pulse-soft {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.85; }
      }
      .animate-pulse-soft {
        animation: pulse-soft 2s ease-in-out infinite;
      }

      .animate-fadeIn {
        animation: fadeIn var(--duration-normal) var(--ease-default) forwards;
      }

      .animate-scaleUp {
        animation: scaleUp var(--duration-normal) ease-out forwards;
      }
      @keyframes k-fade-out { from { opacity: 1; } to { opacity: 0; } }
      @keyframes k-panel-in { from { transform: translateX(100%); } to { transform: none; } }
      @keyframes k-panel-out { from { transform: none; } to { transform: translateX(100%); } }
      @keyframes k-dz-dim { from { opacity: var(--k-dz-from); } to { opacity: var(--k-dz-to); } }
      @keyframes k-dz-drop { from { transform: translateY(var(--k-dz-drop)); } to { transform: none; } }
      @keyframes k-dz-in { from { opacity: 0; } to { opacity: 1; } }
      .k-lib-panel { height: 100%; box-shadow: -14px 0 28px -18px rgba(0, 0, 0, 0.28); }
      .dark .k-lib-panel { box-shadow: -14px 0 28px -18px rgba(0, 0, 0, 0.7); }
      .k-lib-panel-in { animation: k-panel-in 155ms var(--ease-spring) both; }
      .k-lib-panel-out { animation: k-panel-out 140ms var(--ease-default) forwards; }
      .k-lib-side-sheet {
        position: absolute; top: 0; bottom: 0; left: 0; z-index: 8; width: min(300px, 88%);
        transform: translateX(-100%); visibility: hidden; box-shadow: 14px 0 28px -18px rgba(0, 0, 0, 0.28);
        transition: transform 200ms var(--ease-default), visibility 0s linear 200ms;
      }
      .dark .k-lib-side-sheet { box-shadow: 14px 0 28px -18px rgba(0, 0, 0, 0.7); }
      .k-lib-side-sheet.k-lib-side-sheet-on { transform: none; visibility: visible; transition: transform 200ms var(--ease-default), visibility 0s; }
      @media (prefers-reduced-motion: reduce) { .k-lib-side-sheet, .k-lib-side-sheet.k-lib-side-sheet-on { transition-duration: 1ms; } }
      :root:root .k-lib-window .k-lib-side.k-lib-side-sheet { background: var(--k-sidebar); }
      .k-lib-sheet-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--alpha-divider); background: var(--k-sidebar); }

      .k-lib-stack .k-lib-results > .relative { margin-left: auto; }
      .k-lib-short .k-lib-results { min-height: 44px; padding-top: 4px; padding-bottom: 4px; }
